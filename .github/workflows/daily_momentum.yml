name: Daily Momentum Scanner

on:
  repository_dispatch:
    types: [trigger-daily-momentum]
  workflow_dispatch:
jobs:
  run-momentum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread requests yfinance lxml

      - name: Execute Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python momentum_suite/momentum_revised.py
          python momentum_suite/gamma_screener.py
