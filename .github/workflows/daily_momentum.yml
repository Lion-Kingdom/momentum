name: Daily Momentum Scanner

on:
  repository_dispatch:
    types: [trigger-daily-momentum]
  workflow_dispatch:

jobs:
  run-momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy gspread oauth2client requests yfinance pyfinviz lxml google-genai tabulate
      - name: Execute Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python momentum_suite/momentum_revised.py
          python momentum_suite/gamma_screener.py
          python momentum_suite/ai_reporting_pipeline.py
          
      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add momentum_suite/unified_gex_momentum_master_log.csv
          git commit -m "Automated update: Appended daily OHLCV and GEX data" || echo "No changes to commit"
          git push
          python momentum_suite/gamma_screener.py
          python momentum_suite/ai_reporting_pipeline.py

      
