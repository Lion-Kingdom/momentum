name: Engine 6 Day Trade Snapshots

on:
  schedule:
    # Runs at ~7:25 AM, 10:25 AM, 1:25 PM, and 4:25 PM EDT (Mon-Fri)
    # Using minute '25' avoids the massive GitHub queue backlog at ':30'
    - cron: '25 11,14 * * 1-5'
  workflow_dispatch:

jobs:
  run-engine6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread requests yfinance pyfinviz lxml

      - name: Execute Engine 6 Intraday Pipeline
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python momentum_suite/engine6_intraday.py
