name: Engine 6 Day Trade Snapshots

on:
  schedule:
    # Triggers at 7:30 AM, 10:30 AM, 1:30 PM, and 4:30 PM EST (Mon-Fri)
    - cron: '30 11,14,17,20 * * 1-5'
  workflow_dispatch:

jobs:
  run-engine6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread requests yfinance pyfinviz lxml

      - name: Execute Engine 6 Intraday Pipeline
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python momentum_suite/engine6_intraday.py
